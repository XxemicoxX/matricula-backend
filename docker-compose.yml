services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: matricula_sdj
      MYSQL_USER: matricula
      MYSQL_PASSWORD: matricula
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes: [mysql-data:/var/lib/mysql]
volumes:
  mysql-data:
