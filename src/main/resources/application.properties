spring.application.name=matricula-backend
spring.profiles.default=dev
# La autenticación es por SSO/JWT; no se usa usuario en memoria.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---- Base de datos MySQL (esquema: database/01_esquema_y_datos_base.sql) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/matricula_sdj?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health

# ---- Aplicación ----
app.periodo-actual=2027
app.zona-horaria=America/Lima
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
# JWT_SECRET obligatorio (>= 32 caracteres); en dev se define en application-dev.properties
app.jwt.secret=${JWT_SECRET}
# RNF Seguridad: cierre de sesión tras 15 min de inactividad
app.jwt.inactividad-minutos=15
app.jwt.sesion-maxima-horas=8
# RN-02
app.matricula.reserva-horas=48
app.matricula.monto-defecto=650.00
# stub | real  (stub solo se permite fuera de prod)
app.integraciones.cubicol.modo=${CUBICOL_MODO:real}
app.integraciones.minedu.modo=${MINEDU_MODO:real}
# Secretos HMAC por proveedor: app.integraciones.webhook-secrets.<proveedor>=...
app.storage.ruta=${STORAGE_PATH:./storage}
app.pagos.max-reintentos=5
app.pagos.reintento-ms=60000
app.reservas.barrido-ms=60000

springdoc.swagger-ui.path=/swagger-ui.html
